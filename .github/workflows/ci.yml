name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install test deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlcipher python3 keepassxc
      - name: test
        run: go test ./... -v 2>&1 | tee /tmp/gotest.log
      - name: build all platforms
        run: |
          GOOS=darwin GOARCH=arm64 go build -o bin/ ./cmd/...
          GOOS=linux GOARCH=amd64 go build -o bin/ ./cmd/...
          GOOS=linux GOARCH=arm64 go build -o bin/ ./cmd/...
